on: [workflow_call]

jobs:
  build:
    timeout-minutes: 7
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    environment: Canary

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i386
            cflags: -m32 -march=i386 -mtune=bonnell --target=i386-linux-gnu
            output: OpenCraft-i386

          - arch: x86_64
            cflags: -m64 -march=x86-64 -mtune=bonnell --target=x86_64-linux-gnu
            output: OpenCraft-x86_64v1

    steps:
      - name: Fetch OpenCraft source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - name: Setup LLVM toolchain
        uses: ./.github/actions/llvm-toolchain
        with:
          architecture: ${{ matrix.arch }}
          cflags: ${{ matrix.cflags }}

      - name: Compile
        run: |
          make TARGET="${{ matrix.output }}" \
            COMMON_FLAGS="-Weverything -Wno-unsafe-buffer-usage -O2" | tee build.log

      - name: 🔍 Compiler Diagnostics Report
        if: always()
        run: |
          exec > "$GITHUB_STEP_SUMMARY"
          printf '| Count | Percentage | Warning |\n'
          printf '|------:|-----------:|:--------|\n'

          grep -oE '\[-W[^]]+\]' build.log |
              tr -d '[]' |
              sort |
              uniq -c |
              sort -rn |
              awk '
              {
                  count[NR] = $1
                  warning[NR] = $2
                  total += $1
              }
              END {
                  for (i = 1; i <= NR; i++) {
                      printf "| %d | %.2f%% | `%s` |\n",
                          count[i],
                          count[i] * 100 / total,
                          warning[i]
                  }
              }'

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
