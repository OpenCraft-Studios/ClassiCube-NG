name: Setup LLVM toolchain (with ccache)
description: Setup LLVM toolchain and development dependencies

inputs:
  architecture:
    description: Additional architecture support to install (i386 or x86_64)
    required: false
    default: "x86_64"
  cflags:
      description: Additional flags for clang
      required: true
      default: ""

runs:
  using: composite
  steps:
    - name: Install build dependencies
      if: always()
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ccache \
          mold \
          libxi-dev \
          libgl-dev

    - name: Install development libraries for i386
      if: inputs.architecture == 'i386'
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-multilib \
          libxi-dev:i386 \
          libgl-dev:i386

    - name: Create compiler wrapper
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

        CC="$RUNNER_TEMP/bin/${{ inputs.architecture }}-linux-llvm-clang"
        LD=$(command -v mold || command -v ld.gold || command -v lld)

        cat > "$CC" << EOF
        #!/bin/sh
        exec ccache clang ${{ inputs.cflags }} "\$@"
        EOF

        chmod +x "$CC"
        echo "CC=$CC" >> "$GITHUB_ENV"
        echo "LD=$LD" >> "$GITHUB_ENV"

    - name: Configure ccache
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/ccache"
        ccache --set-config cache_dir="$HOME/.cache/ccache"
        ccache --set-config max_size=5G
        ccache --set-config compression=true

    - name: Cache ccache
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ inputs.architecture }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ inputs.architecture }}
